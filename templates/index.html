<!DOCTYPE html>
<html lang="zh-CN" data-audience="b" data-mode="light" data-density="comfortable" data-brand="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>SendFileDrop · 局域网文件传输</title>
<meta name="description" content="同一局域网内的文件与文字互传工具，扫码连接、拖入文件、确认后发送。">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/vendor/zhaoui/zhaoui.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="sfd-workbench">
<div class="app">
  <div id="drawerBackdrop" class="drawer-backdrop"></div>
  <aside class="sidebar">
    <div class="sidebar-heading"><div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.6a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M2 9a14.4 14.4 0 0 1 20 0" stroke-linecap="round"/></svg></span>
      <span>SendFileDrop</span>
      <button class="zh-btn text sidebar-close" aria-label="关闭侧栏" data-zh-close>关闭</button>
    </div><div class="online-pill"><span class="dot"></span><span id="onlineCount">1</span> 台在线</div></div>
    <input id="searchInput" class="zh-input search-input" aria-label="搜索文件名或文字" placeholder="搜索文件名 / 文字…">
    <div class="sidebar-tools">
      <button id="nicknamePill" class="zh-btn nickname-pill" title="点击修改昵称"></button>
      <button id="connectDevice" class="zh-btn" data-zh-popover="#connectPanel" data-placement="right-start" data-arrow>连接设备</button>
    </div>
    <div class="sidebar-content">
      <div id="sidebarTabs" class="zh-tabs" role="tablist" aria-label="侧栏内容">
        <button id="favoritesTab" role="tab" aria-selected="true" aria-controls="favoritesPanel">收藏</button>
        <button id="sendersTab" role="tab" aria-selected="false" aria-controls="sendersPanel">最近活跃</button>
      </div>
      <section id="favoritesPanel" class="sidebar-panel" aria-labelledby="favoritesTab"><div id="favoritesList" class="favorites-list">__FAVORITES__</div></section>
      <section id="sendersPanel" class="sidebar-panel" aria-labelledby="sendersTab" hidden><div id="sendersList" class="senders-list"></div></section>
    </div>

    <div id="syncFoldersBlock" class="sync-folders-block" style="display:none;">
      <div class="sync-folders-title">同步文件夹</div>
      <div id="syncFoldersList" class="sync-folders-list"></div>
    </div>

    <div class="sidebar-footer"><div class="host-controls">__HOST_CONTROLS__</div>
    <div class="version-badge"><span>v__VERSION__</span></div></div>
  </aside>

  <main class="main">
    <header class="workspace-header">
      <div class="workspace-title"><span class="eyebrow">SendFileDrop / LOCAL TRANSFER</span><h1>局域网传输</h1><p>文件与文字，在设备之间轻松接力。</p></div>
      <label class="theme-control">外观<select id="themeSelect" class="zh-input" aria-label="外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
    </header>
    <div class="mobile-topbar">
      <button id="menuToggle" class="zh-btn menu-btn" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
      </button>
      <span class="mobile-brand">SendFileDrop</span>
    </div>
    <div class="filter-bar">
      <div class="content-filters" role="group" aria-label="内容类型">
      <button class="zh-btn tab active" data-tab="all">全部</button>
      <button class="zh-btn tab" data-tab="text">文字列表</button>
      <button class="zh-btn tab" data-tab="media">多媒体列表</button>
      <button class="zh-btn tab" data-tab="file">文件列表</button>
      </div>
      <div class="time-filter-sep"></div>
      <div class="time-filters" role="group" aria-label="时间范围">
      <button class="zh-btn time-tab" data-time="all">全部时间</button>
      <button class="zh-btn time-tab" data-time="today">今天</button>
      <button class="zh-btn time-tab" data-time="week">本周</button>
      <button class="zh-btn time-tab" data-time="month">本月</button>
      </div>
    </div>

    <div id="feed" class="feed">__FEED__</div>

    <footer class="composer">
      <div id="pendingFiles" class="pending-files" aria-label="待发送文件"></div>
      <div id="uploadQueue" class="upload-queue" aria-live="polite"></div>
      <div class="composer-row">
        <button id="attachBtn" class="zh-btn attach-btn" title="发送文件" aria-label="发送文件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7L14 5.5a3.5 3.5 0 0 1 5 5L10.5 19a2 2 0 0 1-3-3L15 8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea class="zh-textarea" aria-label="消息或文件说明" id="textInput" rows="1" placeholder="输入文字，或拖入文件…"></textarea>
        <button id="sendBtn" class="zh-btn primary send-btn">发送</button>
      </div>
      <div class="composer-hint"><span>拖入文件或粘贴图片，确认后发送</span><span>Enter 发送 · Shift + Enter 换行</span></div>
      <input id="fileInput" type="file" multiple style="display:none">
      <input id="reshareInput" type="file" style="display:none">
    </footer>
  </main>
</div>

<div id="connectPanel" hidden>
  <div class="connect-block">
    <div class="connect-title-row"><div class="connect-heading">连接另一台设备<span>同一 Wi-Fi · 扫码即用</span></div><button class="zh-btn text connect-close" data-close-connect aria-label="关闭连接面板">关闭</button></div>
    <div class="qr-big">__QR__</div>
    <div class="connect-info"><span class="connect-url">__URL__</span><button class="zh-btn copy-url" data-copy-url="__URL__">复制地址</button></div>
  </div>
</div>
<dialog class="zh-modal" id="nicknameDialog" aria-labelledby="nicknameTitle">
  <header id="nicknameTitle">修改昵称</header>
  <form id="nicknameForm">
    <div class="nickname-field"><label for="nicknameInput">其他设备会看到这个名字</label><input class="zh-input" id="nicknameInput" maxlength="40" required autocomplete="nickname"></div>
    <footer><button type="button" class="zh-btn" data-zh-close>取消</button><button class="zh-btn primary" type="submit">保存昵称</button></footer>
  </form>
</dialog>
<script src="/static/vendor/zhaoui/zhaoui.min.js"></script>
<script>var DEFAULT_NAME = "__DEFAULT_NAME__";</script>
<script src="/static/app.js"></script>
</body>
</html>
